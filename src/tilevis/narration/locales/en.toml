# English narration text catalogs for tilevis
# Keyed by Semantic (lowercase/dotted), StepKind (UPPERCASE), or synthetic card key.

[title]
title = "Inside an LLM's Brain"
body = "Let's watch {n_blocks} layer(s) transform colored number tiles step-by-step from your prompt to a next-word prediction."
nerd = "Architecture summary: {n_blocks} block(s), emb_dim={emb_dim}, n_heads={n_heads}."

[end]
title = "Story Complete"
body = "We stepped through every pass and watched the model highlight and add one predicted word at a time."
nerd = "End of recorded trace across all forward passes."

# ---------------------------------------------------------------------------
# Semantic keys (matched first)
# ---------------------------------------------------------------------------

[prompt]
title = "Starting Text"
body = "The model reads the text typed so far and gets ready to predict what comes right after \"{token}\"."
nerd = "Pass input text ending at token {token!r}; context fed before BPE tokenization."

[tokenize]
title = "Chopping Text into Token Chips"
body = "Your text splits into colored token chips tagged with dictionary ID numbers, ending with \"{token}\"."
nerd = "GPT-2 byte-level BPE tokenization converting UTF-8 text into integer token IDs."

[embed]
title = "Looking Up Word & Position Fingerprints"
body = "Each chip pulls a row of {emb_dim} colored tiles from the word shelf, then adds position tiles showing where it sits."
nerd = "Token embedding lookup + learned positional embedding addition -> (T, {emb_dim})."

["block.summary"]
title = "Layer {block_num} of {n_blocks} (Summary)"
body = "Compare what entered and left Layer {block_num}: the What Changed grid shows how the layer gently nudged each word's tiles."
nerd = "Transformer block {block_num}/{n_blocks} residual update: output - input over (T, {emb_dim})."

["block.norm1"]
title = "Layer {block_num}: Squeezing Values Calm"
body = "LayerNorm squeezes noisy spreads into a balanced range (watch the spread meter drop!) alongside learned scale and shift strips."
nerd = "Pre-attention LayerNorm across {emb_dim} features (zero mean, unit variance + learned scale/shift)."

["block.att.qkv"]
title = "Layer {block_num}: Question, Label, Content"
body = "One input splits through three weight grids into Question (Q: what to look for), Label (K: what I offer), and Content (V: what I share)."
nerd = "Linear Q, K, V projections multiplying normalized (T, {emb_dim}) input across {n_heads} head(s)."

["block.att.scores"]
title = "Layer {block_num}: Shining the Spotlight"
body = "Across {n_heads} spotlight head(s), arcs shine from the newest word back to earlier words while grey future cells stay hidden."
nerd = "Causal scaled dot-product attention softmax(Q K^T / sqrt(d_k)) across {n_heads} head(s)."

["block.att.mix"]
title = "Layer {block_num}: Blending Spotlighted Content"
body = "The spotlight weights blend each earlier word's Content (V) tiles into a combined context row."
nerd = "Multi-head attention context mix: attn_weights @ V reshaped back to (T, {emb_dim})."

["block.att.out"]
title = "Layer {block_num}: Stitching Attention Together"
body = "Sweeping across weight columns combines all {n_heads} spotlight head viewpoints into one updated tile strip per word."
nerd = "Attention output projection linear layer: (T, {emb_dim}) x ({emb_dim}, {emb_dim}) -> (T, {emb_dim})."

["block.resid1"]
title = "Layer {block_num}: The Highway Add"
body = "Old memories stay safe on the top highway while the new attention update slides up and merges into the combined tiles."
nerd = "First residual connection: x_mid = x_shortcut + attn_update (prevents vanishing signals)."

["block.norm2"]
title = "Layer {block_num}: Calm-Down Squeeze Again"
body = "A second balance squeeze centers every word's spread before each token enters its solo thinking workspace."
nerd = "Pre-MLP LayerNorm normalizing {emb_dim} features per token before feed-forward expansion."

["block.ff.expand"]
title = "Layer {block_num}: Expanding the Scratchpad"
body = "Input tiles sweep across learned weights to stretch each word from {emb_dim} into a roomy {ff_dim}-tile scratchpad."
nerd = "MLP expansion linear transform: (T, {emb_dim}) x ({emb_dim}, {ff_dim}) -> (T, {ff_dim})."

["block.ff.act"]
title = "Layer {block_num}: Filtering Signals (GELU)"
body = "Following the GELU filter curve, negative tiles dim quietly toward zero while bright positive ideas pass through."
nerd = "GELU nonlinearity filtering negative pre-activations across (T, {ff_dim})."

["block.ff.contract"]
title = "Layer {block_num}: Packing Insights Back"
body = "Weights sweep across columns to shrink the {ff_dim}-tile scratchpad neatly back down to {emb_dim} highway tiles."
nerd = "MLP contraction linear transform: (T, {ff_dim}) x ({ff_dim}, {emb_dim}) -> (T, {emb_dim})."

["block.resid2"]
title = "Layer {block_num}: Second Highway Merge"
body = "Solo thinking slides into the bypass highway, merging new insights with running memory before leaving Layer {block_num}."
nerd = "Second residual connection completing transformer block {block_num}/{n_blocks}."

[final_norm]
title = "Final Polish"
body = "After all {n_blocks} layer(s), a final balance squeeze polishes every word's {emb_dim} tiles before voting on the next word."
nerd = "Final LayerNorm applied after block {n_blocks} over {emb_dim} features."

[lm_head]
title = "Scoring Candidate Words"
body = "The last token \"{token}\" meets top candidate word weights on the scoreboard to compute raw scores."
nerd = "Language-model head dot product on final token against candidate output columns -> logits."

[next_token]
title = "And the Next Word Is..."
body = "Probabilities line up as bars; winning word \"{top_word}\" ({top_prob:.0%}) flies right onto the end of the text!"
nerd = "Softmax probabilities over top candidates; top candidate={top_word!r} ({top_prob:.0%})."

[generic]
title = "Neural Layer Step"
body = "Input number tiles flow through this layer's learned weights to create updated output tiles."
nerd = "Generic tensor snapshot display for step."

# ---------------------------------------------------------------------------
# StepKind keys (fallback if semantic key is absent)
# ---------------------------------------------------------------------------

[PROMPT]
title = "Input Prompt"
body = "Typing out the prompt ending at \"{token}\" before splitting it into pieces."
nerd = "Prompt preparation step."

[TOKENIZE]
title = "Tokenization Chips"
body = "Splitting text into colored vocabulary chips ending with \"{token}\"."
nerd = "Tokenization output sequence."

[EMBEDDING]
title = "Word & Position Fingerprints"
body = "Adding word meaning tiles and position tiles across {emb_dim} features."
nerd = "Token and position embedding sum over {emb_dim} dims."

[LAYERNORM]
title = "Balancing Tile Spread"
body = "Squeezing extreme tile values back into a calm, balanced range."
nerd = "LayerNorm across {emb_dim} features."

[LINEAR]
title = "Weighted Matrix Transform"
body = "Input tiles sweep left-to-right across a weight grid to fill updated output columns."
nerd = "Matrix multiplication X @ W -> Y."

[QKV_PROJECTION]
title = "Question, Label & Content"
body = "Branching normalized tiles into Question, Label, and Content strips across {n_heads} head(s)."
nerd = "Q, K, V linear projections with {n_heads} attention head(s)."

[ATTENTION_PATTERN]
title = "Attention Spotlight"
body = "Spotlight arcs highlight which earlier words matter across {n_heads} head(s); future cells stay grey."
nerd = "Causal softmax attention weight map across {n_heads} head(s)."

[ATTENTION_MIX]
title = "Blending Attended Values"
body = "Blending Content tiles together using the attention spotlight weights."
nerd = "Context vectors computed as attention weights times Value tiles."

[ACTIVATION]
title = "Nonlinear Filter"
body = "Dimming negative tiles along the activation curve while keeping bright positive features."
nerd = "Elementwise activation function applied to hidden layer tiles."

[RESIDUAL_ADD]
title = "Highway Shortcut Add"
body = "Sliding the layer update onto the bypass highway stream to combine both."
nerd = "Residual stream addition: output = shortcut + update."

[BLOCK_SUMMARY]
title = "Layer {block_num} Summary"
body = "Comparing entering tiles, leaving tiles, and what changed across layer {block_num} of {n_blocks}."
nerd = "Summarized transformer block transition ({block_num}/{n_blocks})."

[LOGITS]
title = "Word Scoreboard"
body = "Matching the final tile pattern for \"{token}\" against candidate next words."
nerd = "Output head logit projection on last token."

[NEXT_TOKEN]
title = "Next-Word Prediction"
body = "Choosing the winning next token; top guess is \"{top_word}\" ({top_prob:.0%})."
nerd = "Candidate probability ranking (top={top_word!r}, p={top_prob:.0%})."

[GENERIC]
title = "Computation Step"
body = "Visualizing tensor values captured at this stage of the model."
nerd = "Fallback generic step view."
