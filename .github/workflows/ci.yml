name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[record,dev]"

    - name: Lint and format check with ruff
      run: |
        ruff check src tests
        ruff format --check src tests

    - name: Type check with mypy
      run: |
        mypy src/tilevis/core src/tilevis/narration src/tilevis/render
        mypy src/tilevis/probe

    - name: Import boundary verification
      run: |
        pytest tests/test_import_boundaries.py

    - name: Run test suite
      run: |
        pytest -m "not slow and not manual" --cov=tilevis
